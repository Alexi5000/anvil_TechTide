name: Quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Build, lint, type-check, and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install native build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential python3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build frontend and workspace packages
        run: pnpm build:ci

      - name: Lint CI surface
        run: pnpm lint:ci

      - name: Type-check source
        run: pnpm typecheck

      - name: Run smoke tests
        run: pnpm test:smoke

      - name: Build and test authenticated gateway
        run: |
          pnpm --dir server build
          pnpm --dir server test
          pnpm exec vitest run core/gateway/client-auth.test.ts src/entities/gateway-channels/__tests__

      - name: Run transcript fixture regressions
        run: pnpm exec vitest run core/lib/transcript/parser.test.ts

      - name: Run sidecar regression tests
        run: pnpm --dir sidecar test

      - name: Run agent regression tests
        run: pnpm --dir agents test

  macos-native:
    name: Check macOS application
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:ci
      - run: cargo check --locked --manifest-path src-tauri/Cargo.toml
